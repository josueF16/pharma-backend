server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.driver.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8082,http://127.0.0.1:8082}"

logging:
  level:
    root: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

  file:
    name: ${LOG_FILE:logs/pharma-backend.log}

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-sin-id}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-sin-id}] %logger{36} - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE:logs/pharma-backend.log}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB