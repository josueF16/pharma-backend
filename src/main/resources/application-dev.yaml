server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:PHARMADB}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: PHARMADB
    baseline-on-migrate: true
    baseline-version: "1"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: 60
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200,http://localhost:3000,http://localhost:8082,http://127.0.0.1:8082"